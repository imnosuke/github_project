x-demo-streamlit: &demo-streamlit
  image: reposcope-streamlit:local
  build:
    context: ./apps/streamlit
  volumes:
    - ./apps:/workspace/apps:ro
    - ./ml:/workspace/ml:ro
  restart: unless-stopped

services:
  minio:
    ports: !reset []

  clickhouse:
    ports: !reset []

  airflow-webserver:
    ports: !reset []
    environment:
      AIRFLOW__WEBSERVER__BASE_URL: http://127.0.0.1:${REPOSCOPE_DEMO_PORT:-8089}/airflow
      AIRFLOW__WEBSERVER__WORKERS: '2'
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/airflow/health || exit 1"]

  airflow-scheduler:
    environment:
      AIRFLOW__WEBSERVER__BASE_URL: http://127.0.0.1:${REPOSCOPE_DEMO_PORT:-8089}/airflow
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
      APP02_REGISTRY_FILE: /opt/airflow/demo/registry.json
    volumes:
      - ./demo/registry.json:/opt/airflow/demo/registry.json:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  demo-first-run:
    extends:
      file: docker-compose.yaml
      service: airflow-scheduler
    container_name: gharchive-demo-first-run
    depends_on:
      airflow-scheduler:
        condition: service_started
      clickhouse:
        condition: service_healthy
    environment:
      APP_SNAPSHOT_DIR: /opt/airflow/datasets/gharchive-2026-07-21/snapshot
      APP02_SCHEMA_PATH: /opt/airflow/app-02-serving-schema.sql
    volumes:
      - ./demo/queue_ingest.py:/opt/airflow/demo/queue_ingest.py:ro
      - ./ml/datasets:/opt/airflow/datasets:ro
      - ./docs/app-ml/app-02-serving-schema.sql:/opt/airflow/app-02-serving-schema.sql:ro
    command: ["python", "/opt/airflow/demo/queue_ingest.py"]
    restart: "no"

  superset:
    ports: !reset []
    environment:
      SUPERSET_CONFIG_PATH: /app/demo_superset_config.py
    volumes:
      - ./demo/superset_config.py:/app/demo_superset_config.py:ro

  demo-reposcope:
    <<: *demo-streamlit
    environment:
      APP_DATA_SOURCE: snapshot
      APP_SNAPSHOT_DIR: /workspace/ml/datasets/gharchive-2026-07-21/snapshot
      APP_PIPELINE_RUNS_FILE: /workspace/ml/datasets/gharchive-2026-07-21/de-evidence/app10-airflow-runs.json
    command:
      - python
      - -m
      - streamlit
      - run
      - apps/streamlit/app.py
      - --server.baseUrlPath=reposcope

  demo-ml:
    <<: *demo-streamlit
    environment:
      APP_ML_BATCH_FILE: /tmp/ml04-local.json
      APP_SNAPSHOT_DIR: /workspace/ml/datasets/gharchive-2026-07-21/snapshot
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f "$$APP_ML_BATCH_FILE" ]; then
          python -m ml.local_batch --output "$$APP_ML_BATCH_FILE"
        fi
        exec python -m streamlit run apps/streamlit/retrospective_demo.py --server.baseUrlPath=ml

  demo-gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${REPOSCOPE_DEMO_PORT:-8089}:8080"
    volumes:
      - ./demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./demo/index.html:/srv/index.html:ro
    depends_on:
      - demo-reposcope
      - demo-ml
      - airflow-webserver
      - superset
    restart: unless-stopped
