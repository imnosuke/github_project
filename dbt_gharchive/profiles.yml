dbt_gharchive:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: bronze
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'clickhouse') }}"
      secure: false
      verify: false
      threads: 2
      custom_settings:
        max_bytes_before_external_sort: 1073741824
        max_threads: 2

